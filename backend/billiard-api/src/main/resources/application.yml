spring:
  application:
    name: poolhawk-api
   
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/poolhawk_db}
    username: ${SPRING_DATASOURCE_USERNAME:poolhawk_user}
    password: ${SPRING_DATASOURCE_PASSWORD:poolhawk_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # NUEVO: Evita que Jackson explote (Error 500) si el JSON trae campos extra
  jackson:
    deserialization:
      fail-on-unknown-properties: false

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 500MB

# NUEVO: Configuración JWT (mínimo 32 caracteres para HS256)
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000 # 24 horas en milisegundos