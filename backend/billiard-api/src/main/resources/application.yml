spring:
  application:
    name: poolhawk-api

  datasource:
    url: jdbc:postgresql://localhost:5433/poolhawk_db
    username: ${DB_USER:poolhawk_user}
    password: ${DB_PASSWORD:poolhawk_password}
    driver-class-name: org.postgresql.Driver

  # Migraciones versionadas con Flyway
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    validate-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  jackson:
    deserialization:
      fail-on-unknown-properties: false

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

jwt:
  secret: ${JWT_SECRET:SuperSecretoPoolHawk2026_cambialo_por_algo_de_32_o_mas_caracteres}
  expiration: 86400000