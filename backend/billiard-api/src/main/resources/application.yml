spring:
  application:
    name: poolhawk-api

  datasource:
    url: jdbc:postgresql://localhost:5433/poolhawk_db
    username: ${DB_USER:poolhawk_user}
    password: ${DB_PASSWORD:poolhawk_password}
    driver-class-name: org.postgresql.Driver

  # H-04: migraciones versionadas con Flyway.
  # baseline-version=0 garantiza que en una BD vacía se apliquen V1 y V2.
  # En una BD existente, Flyway marca baseline en 0 y aplica V1 (no-op por
  # IF NOT EXISTS) y V2 (endurecimiento de NOT NULL con validación previa).
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    validate-on-migrate: true

  jpa:
    hibernate:
      # En desarrollo se mantiene 'update' para no bloquear iteraciones rápidas.
      # En producción debe cambiarse a 'validate' una vez las migraciones
      # Flyway son la única fuente de verdad del esquema.
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  jackson:
    deserialization:
      fail-on-unknown-properties: false

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

jwt:
  secret: ${JWT_SECRET:SuperSecretoPoolHawk2026_cambialo_por_algo_de_32_o_mas_caracteres}
  expiration: 86400000