spring:
  application:
    name: poolhawk-api
  
  datasource:
    url: jdbc:postgresql://localhost:5433/poolhawk_db
    username: ${DB_USER:poolhawk_user}
    password: ${DB_PASSWORD:poolhawk_password} # Ahora usa variable de entorno
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# NUEVO: Configuración JWT (mínimo 32 caracteres para HS256)
jwt:
  secret: ${JWT_SECRET:SuperSecretoPoolHawk2026_cambialo_por_algo_de_32_o_mas_caracteres}
  expiration: 86400000 # 24 horas en milisegundos