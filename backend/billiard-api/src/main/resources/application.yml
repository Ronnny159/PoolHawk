spring:
  application:
    name: poolhawk-api
  
  datasource:
    url: jdbc:postgresql://localhost:5433/poolhawk_db
    username: ${DB_USER}
    password: ${DB_PASSWORD} # Ahora usa variable de entorno
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # NUEVO: Evita que Jackson explote (Error 500) si el JSON trae campos extra
  jackson:
    deserialization:
      fail-on-unknown-properties: false

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# NUEVO: ConfiguraciÃ³n JWT (mÃ­nimo 32 caracteres para HS256)
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000 # 24 horas en milisegundos
