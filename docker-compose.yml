services:
  # 1. El motor de la Base de Datos
  postgres:
    image: postgres:16-alpine
    container_name: poolhawk-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en el archivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en el archivo .env}
    ports:
      - "5433:5432"
    volumes:
      - poolhawk_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. Interfaz visual para ver la base de datos
  adminer:
    image: adminer:latest
    container_name: poolhawk-adminer
    restart: always
    ports:
      - "8081:8080"
    depends_on:
      - postgres

  # 3. Backend (Spring Boot)
      # 3. Backend (Spring Boot)
  backend:
    build: ./backend
    container_name: poolhawk-backend
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/poolhawk_db
      SPRING_DATASOURCE_USERNAME: poolhawk_user
      SPRING_DATASOURCE_PASSWORD: poolhawk_password
      # NUEVO: Variable para el Token JWT (el valor real se lee del archivo .env)
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en el archivo .env}
    ports:
      - "8080:8080"

  # 4. Frontend (Vue + Nginx)
  frontend:
    build: ./frontend
    container_name: poolhawk-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  poolhawk_data: