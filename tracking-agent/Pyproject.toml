# Configuración del agente de visión de PoolHawk.
#   pip install -e ".[dev,headless]"   -> desarrollo y CI (OpenCV sin interfaz gráfica)
#   pip install -e ".[gui]"            -> uso con cámara y ventana (cv2.imshow)
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poolhawk-tracking-agent"
version = "0.1.0"
description = "Agente de visión por computador de PoolHawk"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "requests"]

[project.optional-dependencies]
# OpenCV va en extras porque 'opencv-python' y 'opencv-python-headless' no deben instalarse juntos.
gui = ["opencv-python>=4.8"]
headless = ["opencv-python-headless>=4.8"]
dev = ["pytest>=8.0"]

[tool.setuptools]
py-modules = [
    "api_client", "ball_classifier", "ball_detector", "ball_tracker", "calibracion",
    "camera_source", "cola_eventos", "config_agente", "shot_analyzer", "traza", "vision_agent",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
