name: Tracking Agent CI

on:
  push:
    branches: [ main, develop, 'feature/**', 'fix/**' ]
    paths: [ 'tracking-agent/**', '.github/workflows/tracking-agent.yml' ]
  pull_request:
    branches: [ main, develop ]
    paths: [ 'tracking-agent/**' ]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tracking-agent
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tracking-agent/requirements*.txt

      - name: Instalar dependencias (OpenCV headless para CI)
        run: |
          pip install opencv-python-headless numpy requests pytest

      - name: Ejecutar pruebas
        run: python -m pytest test -q