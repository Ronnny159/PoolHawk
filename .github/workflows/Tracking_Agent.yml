name: Tracking Agent CI

on:
  push:
    branches: [ main, develop, 'feature/**', 'fix/**' ]
    paths:
      - 'tracking-agent/**'
      - '.github/workflows/Tracking_Agent.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'tracking-agent/**'
      - '.github/workflows/Tracking_Agent.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tracking-agent
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tracking-agent/requirements*.txt

      - name: Instalar dependencias (OpenCV headless para CI)
        run: pip install opencv-python-headless numpy requests pytest

      - name: Verificar que los modulos estan en minuscula (Linux distingue mayusculas)
        run: |
          if ls *.py | grep -q '[A-Z]'; then
            echo "::error::Hay modulos con mayusculas en el nombre:"; ls *.py | grep '[A-Z]'; exit 1
          fi

      - name: Compilar y verificar imports
        run: |
          python -m compileall -q .
          python -c "import api_client, cola_eventos, ball_classifier, ball_detector, ball_tracker, camera_source, shot_analyzer, traza, calibracion, vision_agent"

      - name: Verificar que se descubren pruebas
        run: python -m pytest --collect-only test -q

      - name: Ejecutar pruebas
        run: python -m pytest test -q