server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Permitir subida de archivos grandes (videos hasta 500MB)
    client_max_body_size 500M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' http://localhost:8080 ws://localhost:8080 http://backend:8080 ws://backend:8080;" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}